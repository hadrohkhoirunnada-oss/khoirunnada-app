<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="obsidianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1510"/>
      <stop offset="100%" stop-color="#0A0806"/>
    </linearGradient>
    <linearGradient id="royalGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E5C9"/>
      <stop offset="35%" stop-color="#DCA03C"/>
      <stop offset="70%" stop-color="#B58228"/>
      <stop offset="100%" stop-color="#8C5E16"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#obsidianGrad)" stroke="url(#royalGoldGrad)" stroke-width="12"/>
  <!-- Inner Specular Border -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Decorative Star Octagram Islamic Motif -->
  <g fill="none" stroke="url(#royalGoldGrad)" stroke-width="5" opacity="0.45" transform="translate(256, 256) scale(1.6)">
    <rect x="-40" y="-40" width="80" height="80" rx="4"/>
    <rect x="-40" y="-40" width="80" height="80" rx="4" transform="rotate(45)"/>
  </g>
  <!-- Text Monogram -->
  <text x="256" y="295" font-family="'Plus Jakarta Sans', serif" font-weight="800" font-size="140" fill="url(#royalGoldGrad)" text-anchor="middle" letter-spacing="8">KN</text>
  <text x="256" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="28" fill="#F5E5C9" text-anchor="middle" letter-spacing="6">KHOIRUNNADA</text>
</svg>