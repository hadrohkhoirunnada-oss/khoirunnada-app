<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Khoirunnada</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8f6f0; color: #151917; min-height: 100vh; margin: 0; display: grid; place-items: center; text-align: center; }
      main { padding: 24px; max-width: 360px; }
      h1 { font-size: 22px; }
      p { color: #525d58; line-height: 1.5; }
      button { border: 0; border-radius: 12px; padding: 12px 20px; background: #996a19; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>Periksa koneksi internet, lalu coba buka kembali aplikasi.</p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
